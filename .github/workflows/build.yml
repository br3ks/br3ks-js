name: Build br3k-js

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build JAR
        run: .\gradlew.bat clean jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: br3k-js
          path: build/libs/*.jar